steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'us-central1-docker.pkg.dev/armormeds-production/armormeds/app:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/armormeds-production/armormeds/app:latest'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/armormeds-production/armormeds/app'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - armormeds
      - '--image=us-central1-docker.pkg.dev/armormeds-production/armormeds/app:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-secrets=SESSION_SECRET=SESSION_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,VITE_STRIPE_PUBLIC_KEY=VITE_STRIPE_PUBLIC_KEY:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest'
      - '--network=armormeds-vpc'
      - '--subnet=armormeds-run-subnet'
      - '--vpc-egress=private-ranges-only'

images:
  - 'us-central1-docker.pkg.dev/armormeds-production/armormeds/app:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/armormeds-production/armormeds/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
